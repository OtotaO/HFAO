[project]
name = "hfao"
version = "0.1.0"
description = "Hugging Face Agent Observatory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "msgspec>=0.18.0",
    "duckdb>=1.1.0",
    "clickhouse-connect>=0.7.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "granian>=1.5.0",
    "gradio>=6.0.0",
    "huggingface-hub>=0.24.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "fastmcp>=0.1.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]

[project.scripts]
hfao = "hfao.cli:app"

[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2.0", "presidio-anonymizer>=2.2.0", "spacy>=3.7.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pyright>=1.1.0",
    "gradio-client>=1.3.0",
    "playwright>=1.45.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/hfao"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["packages/hfao-py-tests", "tests"]
python_files = "test_*.py"
addopts = "--strict-markers"
# Add the repo root so `from apps.cockpit...` resolves in AC §10 tests
# without requiring `apps/` to be a wheel-installed package.
pythonpath = ["."]
markers = [
    "acceptance: marks tests as acceptance tests (deselect with '-m \"not acceptance\"')",
    "perf: marks tests as performance tests",
]
